name: Build Tweak

# 推送代码 或 手动触发时自动编译
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          # ldid (伪签名工具) 用官方预编译版，Ubuntu 源里没有
          sudo curl -sL -o /usr/local/bin/ldid \
            https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64
          sudo chmod +x /usr/local/bin/ldid
          ldid -V || true

      - name: Setup Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive --depth=1 https://github.com/theos/theos.git $THEOS
          rm -rf $THEOS/sdks
          git clone --depth=1 https://github.com/theos/sdks.git $THEOS/sdks
          # 官方 install-theos 同款 iOS 交叉工具链
          curl -sL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz | tar -xJ -C $THEOS/toolchain/
          ls $THEOS/toolchain/linux/iphone/bin/clang
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Build packages
        run: |
          cd wcvoiceclone
          mkdir -p out
          VER=$(grep '^Version:' control | awk '{print $2}' | tr -d ' ')
          echo "版本号: $VER"
          echo "== 有根版: WCVoiceClone_${VER}_iphoneos-arm.deb (双切片) =="
          make package FINALPACKAGE=1
          mv packages/*.deb "out/WCVoiceClone_${VER}_iphoneos-arm.deb"
          make clean >/dev/null
          echo "== 无根版: WCVoiceClone_${VER}_iphoneos-arm64e.deb (Dopamine) =="
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          cp $(ls packages/*.deb | head -1) "out/WCVoiceClone_${VER}_iphoneos-arm64e.deb"
          ls -la out/

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: WCVoiceClone-deb
          path: wcvoiceclone/out/*.deb
